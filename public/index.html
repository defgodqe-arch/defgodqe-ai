<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>defgodqe AI</title>
  <style>
    :root{--yellow:#facc15;--bg:#05070b;--panel:#0c1119;--muted:#94a3b8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 0,#facc1518,transparent 42%),var(--bg);color:#fff;display:grid;place-items:center;padding:24px}
    .app{width:min(900px,100%);border:1px solid #ffffff12;border-radius:28px;background:#0b0f16e8;box-shadow:0 30px 100px #000;overflow:hidden}
    header{padding:30px 32px;border-bottom:1px solid #ffffff10;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:28px;letter-spacing:-.04em}h1 span{color:var(--yellow);text-shadow:0 0 25px #facc1566}header p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .chat{padding:24px}.messages{height:390px;overflow:auto;padding:8px}.message{max-width:80%;padding:13px 15px;border-radius:16px;margin:10px 0;background:#ffffff08;border:1px solid #ffffff0d}.assistant{border-color:#facc1520}.user{margin-left:auto;background:#facc1512}.composer{display:flex;gap:10px;margin-top:16px}.composer textarea{flex:1;min-height:54px;resize:vertical;border:1px solid #ffffff15;border-radius:15px;background:#05070b;color:#fff;padding:15px;font:inherit;outline:none}.composer textarea:focus{border-color:#facc1566}.send{border:0;border-radius:15px;background:var(--yellow);color:#111827;font-weight:900;padding:0 22px;cursor:pointer}
    .neon{margin:0 0 20px;width:100%;padding:18px 20px;border:1px solid #facc1566;border-radius:18px;background:linear-gradient(135deg,#facc1514,#ffffff04);color:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 0 35px #facc1510;transition:.2s}.neon:hover{transform:translateY(-2px);box-shadow:0 0 45px #facc1530}.icon{font-size:28px}.neon strong{display:block;font-size:16px}.neon small{display:block;color:#94a3b8;margin-top:3px}.live{margin-left:auto;font-size:10px;font-weight:900;color:#fde047;border:1px solid #facc1544;border-radius:999px;padding:6px 9px}
    footer{text-align:center;padding:16px;color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <div class="app">
    <header><div><h1>defgodqe <span>AI</span></h1><p>Your AI. Your Ideas. Your World.</p></div></header>
    <main class="chat">
      <button class="neon" onclick="location.href='/game'" type="button"><div class="icon">⚡</div><div><strong>Neon Tag</strong><small>Enter the multiplayer laser freeze arena</small></div><span class="live">LIVE</span></button>
      <div id="messages" class="messages"><div class="message assistant">Welcome to defgodqe. Ask me anything, or jump into Neon Tag above.</div></div>
      <div class="composer"><textarea id="input" placeholder="Type your message..."></textarea><button id="send" class="send">Send</button></div>
    </main>
    <footer>Powered by defgodqe-ai · Neon Tag multiplayer</footer>
  </div>
  <script>
    const input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages');
    async function chat(){const text=input.value.trim();if(!text)return;input.value='';messages.insertAdjacentHTML('beforeend',`<div class="message user"></div>`);messages.lastElementChild.textContent=text;const m=[{role:'user',content:text}];try{const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:m})});const d=await r.json();const el=document.createElement('div');el.className='message assistant';el.textContent=d.response||d.error||'No response';messages.appendChild(el);messages.scrollTop=messages.scrollHeight}catch(e){const el=document.createElement('div');el.className='message assistant';el.textContent='Connection error.';messages.appendChild(el)}}
send.onclick=chat;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chat()}});
  </script>
</body>
</html>
